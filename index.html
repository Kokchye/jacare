<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#fbcd18">
  <title>JACARÉ</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="https://i.imgur.com/uwP7jKa.png" type="image/x-icon">
<style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: url('https://i.imgur.com/PSyFkUo.png') no-repeat center center fixed;
      background-size: cover;
      color: #fff;
      padding: 20px;
      user-select: none;
      position: relative;
      z-index: 0;
    }

    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(8px);
      z-index: -1;
    }

    label {
      display: block;
      margin: 10px 0 5px;
    }

    input,
    select,
    textarea,
    button {
      padding: 10px;
      margin-bottom: 10px;
      border: none;
      border-radius: 5px;
    }

    input,
    select,
    textarea {
      background-color: #EAEAEA;
      color: #000;
    }

    input[type="text"],
    input[type="number"] {
      width: 100%;
    }

    button {
      width: 100%;
      background-color: #15b611;
      color: black;
      cursor: pointer;
    }

    button i {
      margin-right: 5px;
    }

    .servico {
      display: flex;
      gap: 10px;
      flex-wrap: nowrap;
      margin-bottom: 10px;
    }

    .servico input:nth-child(1) {
      flex: 2;
      min-width: 0;
    }

    .servico input:nth-child(2),
    .servico input:nth-child(3) {
      flex: 1;
      min-width: 0;
    }

    .registro {
      background-color: #000;
      color: #FAF3DD;
      padding: 50px 50px;
      border-radius: 10px;
      margin-top: 15px;
      position: relative;
      box-shadow: 0 0 10px rgba(0,0,0,0.2);
      clip-path: polygon(
        0% 10px, 10px 0%, calc(100% - 10px) 0%, 100% 10px,
        100% calc(100% - 10px), calc(100% - 10px) 100%,
        10px 100%, 0% calc(100% - 10px)
      );
    }

    .registro button {
      width: auto;
      margin: 5px 5px 0 0;
    }

    .search-box {
      margin-bottom: 20px;
    }

    #banner {
      width: 100%;
      max-width: 400px;
      display: block;
      margin: 0 auto 20px;
      filter: drop-shadow(0 0 10px #fbcd18);
    }

    #btnAdicionarServico {
      background-color: #fbcd18;
      color: #1C1C1C;
    }
#confirmModal {
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 999;
}

#confirmBackdrop {
  position: absolute;
  width: 100%;
  height: 100%;
  background: rgba(0, 0, 0, 0.7);
  backdrop-filter: blur(5px);
}

#confirmBox {
  position: relative;
  background: #000;
  border: 2px solid #fbcd18;
  padding: 20px;
  border-radius: 10px;
  color: #fff;
  max-width: 300px;
  text-align: center;
  z-index: 1000;
}

#confirmActions {
  margin-top: 15px;
  display: flex;
  justify-content: space-around;
}

#confirmActions button {
  padding: 8px 12px;
  border: none;
  border-radius: 5px;
  cursor: pointer;
}

#btnCancelar {
  background-color: #ccc;
  color: #000;
}

#btnConfirmar {
  background-color: #fbcd18;
  color: #000;
}

  </style>
</head>

<body>
  <img id="banner" src="https://i.imgur.com/uwP7jKa.png" alt="Jacaré">

  <label><i class="bi bi-person-fill"></i> Cliente:</label>
  <input type="text" id="cliente">

  <label><i class="bi bi-whatsapp"></i> WhatsApp:</label>
  <input type="text" id="placa" placeholder="Opcional...">

  <label><i class="bi bi-basket2-fill"></i> Produtos:</label>
  <div id="servicosContainer"></div>
  <button id="btnAdicionarServico" onclick="adicionarServico()"><i class="bi bi-plus-circle"></i> Adicionar Produtos</button>

  <label><i class="bi bi-chat-left-dots"></i> Observações:</label>
  <textarea id="observacoes" style="width: 100%; height: 80px;"></textarea>

  <button onclick="salvarRegistro()"><i class="bi bi-save"></i> Salvar</button>

  <label><i class="bi bi-search"></i> Buscar Registro:</label>
  <input type="text" id="search" class="search-box" placeholder="Digite para buscar...">

  <div id="registros"></div>

  <script>
    // ... todo o script permanece igual ...
  </script>
  <div id="confirmModal" style="display:none;">
    <div id="confirmBackdrop"></div>
    <div id="confirmBox">
      <p id="confirmText">Tem certeza que deseja apagar?</p>
      <div id="confirmActions">
        <button id="btnCancelar">Cancelar</button>
        <button id="btnConfirmar">Apagar</button>
      </div>
    </div>
  </div>
</body>

</html>
