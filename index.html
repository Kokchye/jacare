<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#fbcd18">
  <title>Jacaré Nargs</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  
  <!-- Manifesto -->
  <link rel="manifest" href="manifest.json">

  <!-- Ícone -->
  <link rel="icon" href="icone.ico" type="image/x-icon">
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: url('https://302017-litoralcar-org.s3.unifique.cloud/litoralcar/31/ferrari-812---2023-20595525-003.webp') no-repeat center center fixed;
      background-size: cover;
      color: #fff;
      padding: 20px;
      user-select: none;
      position: relative;
      z-index: 0;
    }

    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(8px);
      z-index: -1;
    }

    label {
      display: block;
      margin: 10px 0 5px;
    }

    input,
    select,
    textarea,
    button {
      width: 100%;
      padding: 10px;
      margin-bottom: 10px;
      border: none;
      border-radius: 5px;
    }

    input,
    select,
    textarea {
      background-color: #EAEAEA;
      color: #1C1C1C;
    }

    button {
      background-color: #fbcd18;
      color: white;
      cursor: pointer;
    }

    button i {
      margin-right: 5px;
    }

    .servico {
      display: flex;
      gap: 10px;
    }

    .registro {
      background-color: #FAF3DD;
      color: #1C1C1C;
      padding: 50px 50px;
      border-radius: 10px;
      margin-top: 15px;
      position: relative;
      box-shadow: 0 0 10px rgba(0,0,0,0.2);
      clip-path: polygon(
        0% 10px, 10px 0%, calc(100% - 10px) 0%, 100% 10px,
        100% calc(100% - 10px), calc(100% - 10px) 100%,
        10px 100%, 0% calc(100% - 10px)
      );
    }

    .registro button {
      width: auto;
      margin: 5px 5px 0 0;
    }

    .search-box {
      margin-bottom: 20px;
    }

    #banner {
      width: 100%;
      max-width: 400px;
      display: block;
      margin: 0 auto 20px;
      filter: drop-shadow(0 0 10px red);
    }
  </style>
</head>

<body>
  <img id="banner" src="https://i.imgur.com/9ZwyM3K.png" alt="Jacaré Nargs">

  <label><i class="bi bi-person-fill"></i> Cliente:</label>
  <input type="text" id="cliente">

  <label><i class="bi bi-car-front"></i> Placa do Carro:</label>
  <input type="text" id="placa" style="text-transform: uppercase;">

  <label><i class="bi bi-file-earmark-text"></i> Modelo/Marca:</label>
  <input type="text" id="modeloMarca">

  <label><i class="bi bi-pencil-square"></i> O que foi feito:</label>
  <input type="text" id="resumo">

  <div id="servicosContainer"></div>
  <button onclick="adicionarServico()"><i class="bi bi-plus-circle"></i> Adicionar Serviço</button>

  <label><i class="bi bi-currency-dollar"></i> Mão de obra (R$):</label>
  <input type="number" id="maoDeObra" step="0.01" min="0">

  <label><i class="bi bi-shield-check"></i> Garantia:</label>
  <select id="garantia">
    <option value="">Sem garantia</option>
    <option>1 semana</option>
    <option>1 mês</option>
    <option>3 meses</option>
    <option>6 meses</option>
    <option>1 ano</option>
    <option>2 anos</option>
    <option>5 anos</option>
  </select>

  <label><i class="bi bi-chat-left-dots"></i> Observações:</label>
  <textarea id="observacoes"></textarea>

  <button onclick="salvarRegistro()"><i class="bi bi-save"></i> Salvar</button>

  <label><i class="bi bi-search"></i> Buscar Registro:</label>
  <input type="text" id="search" class="search-box" placeholder="Digite para buscar...">

  <div id="registros"></div>

  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("service-worker.js");
    }

    document.getElementById("placa").addEventListener("input", (e) => {
      let valor = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, "");
      if (valor.length > 3 && valor[3] !== '-') {
        valor = valor.slice(0, 3) + '-' + valor.slice(3);
      }
      e.target.value = valor;
    });

    function adicionarServico() {
      const container = document.createElement("div");
      container.className = "servico";

      const descricao = document.createElement("input");
      descricao.placeholder = "Serviço";

      const valor = document.createElement("input");
      valor.placeholder = "Valor (R$)";
      valor.type = "number";
      valor.step = "0.01";
      valor.min = "0";

      container.appendChild(descricao);
      container.appendChild(valor);
      document.getElementById("servicosContainer").appendChild(container);
    }

    function salvarRegistro() {
      const cliente = document.getElementById("cliente").value;
      const placa = document.getElementById("placa").value.toUpperCase();
      const modeloMarca = document.getElementById("modeloMarca").value;
      const resumo = document.getElementById("resumo").value;
      const garantia = document.getElementById("garantia").value;
      const observacoes = document.getElementById("observacoes").value;
      const maoDeObra = parseFloat(document.getElementById("maoDeObra").value) || 0;

      const servicosInputs = document.querySelectorAll(".servico");
      let servicos = [];
      let total = maoDeObra;

      servicosInputs.forEach(s => {
        const descricao = s.children[0].value;
        const valor = parseFloat(s.children[1].value) || 0;
        if (descricao) {
          servicos.push({ descricao, valor });
          total += valor;
        }
      });

      const dataHora = new Date().toLocaleString();

      const registro = { cliente, placa, modeloMarca, resumo, servicos, garantia, observacoes, maoDeObra, total, dataHora };
      const registros = JSON.parse(localStorage.getItem("registrosBentoCar")) || [];
      registros.push(registro);
      localStorage.setItem("registrosBentoCar", JSON.stringify(registros));

      mostrarRegistros();

      document.querySelectorAll("input, textarea").forEach(e => e.value = "");
      document.getElementById("garantia").value = "";
      document.getElementById("servicosContainer").innerHTML = "";
    }

    function mostrarRegistros(filtro = "") {
      const registros = JSON.parse(localStorage.getItem("registrosBentoCar")) || [];
      const container = document.getElementById("registros");
      container.innerHTML = "";

      const registrosFiltrados = registros.filter(r =>
        JSON.stringify(r).toLowerCase().includes(filtro.toLowerCase())
      );

      if (registrosFiltrados.length === 0) {
        container.innerHTML = "<p style='text-align:center;'>Nenhum registro encontrado.</p>";
        return;
      }

      registrosFiltrados.forEach((r, index) => {
        const div = document.createElement("div");
        div.className = "registro";
        let conteudo = `*🔧BENTO CAR🔧*\n`;
        conteudo += `👤 *Cliente:* ${r.cliente}\n`;
        conteudo += `🚗 *Placa:* ${r.placa}\n`;
        conteudo += `📄 *Modelo/Marca:* ${r.modeloMarca}\n`;
        conteudo += `✍️ *Resumo:* ${r.resumo}\n`;
        if (r.servicos.length > 0) {
          conteudo += `🛠️ *Serviços:*\n`;
          r.servicos.forEach(s => {
            conteudo += `   • ${s.descricao} - R$ ${s.valor.toFixed(2)}\n`;
          });
        }
        conteudo += `📝 *Observações:* ${r.observacoes}\n`;
        conteudo += `💰 *Mão de obra:* R$ ${r.maoDeObra.toFixed(2)}\n`;
        if (r.garantia) conteudo += `📦 *Garantia:* ${r.garantia}\n`;
        conteudo += `📅 *Data:* ${r.dataHora}\n`;
        conteudo += `💵 *Total:* R$ ${r.total.toFixed(2)}`;

        const pre = document.createElement("pre");
        pre.textContent = conteudo;
        div.appendChild(pre);

        const btnDel = document.createElement("button");
        btnDel.innerHTML = '<i class="bi bi-trash"></i> Apagar';
        btnDel.onclick = () => {
          if (confirm(`Tem certeza que deseja apagar o registro de ${r.cliente}?`)) {
            const registros = JSON.parse(localStorage.getItem("registrosBentoCar")) || [];
            registros.splice(index, 1);
            localStorage.setItem("registrosBentoCar", JSON.stringify(registros));
            mostrarRegistros();
          }
        };

        const btnEdit = document.createElement("button");
        btnEdit.innerHTML = '<i class="bi bi-pencil"></i> Editar';
        btnEdit.onclick = () => {
          document.getElementById("cliente").value = r.cliente;
          document.getElementById("placa").value = r.placa;
          document.getElementById("modeloMarca").value = r.modeloMarca;
          document.getElementById("resumo").value = r.resumo;
          document.getElementById("garantia").value = r.garantia;
          document.getElementById("observacoes").value = r.observacoes;
          document.getElementById("maoDeObra").value = r.maoDeObra;

          document.getElementById("servicosContainer").innerHTML = "";
          r.servicos.forEach(s => {
            adicionarServico();
            const ult = document.querySelectorAll(".servico");
            const ultimo = ult[ult.length - 1];
            ultimo.children[0].value = s.descricao;
            ultimo.children[1].value = s.valor;
          });

          const registros = JSON.parse(localStorage.getItem("registrosBentoCar")) || [];
          registros.splice(index, 1);
          localStorage.setItem("registrosBentoCar", JSON.stringify(registros));
          mostrarRegistros();
        };

        const btnWpp = document.createElement("button");
        btnWpp.innerHTML = '<i class="bi bi-whatsapp"></i> Enviar';
        btnWpp.onclick = () => {
          const msg = encodeURIComponent(conteudo);
          window.open(`https://wa.me/?text=${msg}`, "_blank");
        };

        div.appendChild(btnDel);
        div.appendChild(btnEdit);
        div.appendChild(btnWpp);

        container.appendChild(div);
      });
    }

    document.getElementById("search").addEventListener("input", (e) => {
      mostrarRegistros(e.target.value);
    });

    mostrarRegistros();
  </script>
</body>

</html>
